<!doctype html>
<html>
	<head lang="en">
		<meta charset="utf-8" />
		<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
	</head>
	<body>
		<sdpi-item label="Profile">
			<sdpi-textfield setting="profile" placeholder="Leave empty for next or previous"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Without a name">
			<sdpi-select setting="direction" default="next">
				<option value="next">Next profile</option>
				<option value="previous">Previous profile</option>
			</sdpi-select>
		</sdpi-item>
		<sdpi-item label="Port">
			<sdpi-textfield setting="port" global placeholder="8765"></sdpi-textfield>
		</sdpi-item>
		<sdpi-item label="Token">
			<sdpi-password setting="token" global></sdpi-password>
		</sdpi-item>
		<sdpi-item>
			<p style="color:#999;font-size:9pt;margin:0">In FaderDeck: Settings, Remote control. Tick "Allow control by other programs", then copy the port and token here. They are shared by all FaderDeck keys.</p>
		</sdpi-item>
	</body>
</html>

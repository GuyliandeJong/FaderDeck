<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/remote/manifest.webmanifest">
<link rel="icon" href="/remote/icon-192.png">
<link rel="apple-touch-icon" href="/remote/icon-192.png">
<title>FaderDeck</title>
<style>
:root { --bg: #0d1117; --card: #111923; --line: #30363d; --text: #e6edf3; --muted: #8ba0b5;
        --blue: #58a6ff; --red: #f85149; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
body { margin: 0; background: var(--bg); color: var(--text);
       font: 15px/1.4 "Segoe UI", system-ui, sans-serif; user-select: none; }
header { display: flex; align-items: center; gap: 10px; padding: 14px 16px; }
header img { width: 30px; height: 30px; border-radius: 7px; }
header b { font-size: 19px; } header b span { color: #8a5cff; font-weight: 400; }
#status { margin-left: auto; font-size: 13px; color: var(--muted); }
#status.ok { color: #3fb950; }
main { padding: 0 12px 24px; display: grid; gap: 10px;
       grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.card h2 { margin: 0 0 8px; font-size: 16px; display: flex; justify-content: space-between; }
.card h2 small { color: var(--muted); font-weight: 400; }
input[type=range] { width: 100%; height: 36px; accent-color: var(--accent, var(--blue)); }
.row { display: flex; gap: 8px; margin-top: 8px; }
button { flex: 1; min-height: 46px; border-radius: 9px; border: 1px solid var(--line);
         background: #18232e; color: var(--text); font: 600 14px "Segoe UI", system-ui, sans-serif; }
button.on { border-color: var(--accent, var(--blue)); color: var(--accent, var(--blue)); background: #16202b; }
button.mute.on { border-color: var(--red); color: #fff; background: #54262c; }
button:disabled { opacity: .4; }
select { flex: 2; min-height: 46px; border-radius: 9px; border: 1px solid var(--line);
         background: #18232e; color: var(--text); font-size: 15px; padding: 0 8px; }
#pair { max-width: 360px; margin: 40px auto; text-align: center; padding: 0 16px; }
#pair input { width: 100%; font-size: 30px; letter-spacing: 8px; text-align: center; padding: 10px;
              border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
#pair p { color: var(--muted); }
#error { color: var(--red); min-height: 20px; }
</style>
</head>
<body>
<header><img src="/remote/icon-192.png" alt=""><b>Fader<span>Deck</span></b><div id="status">Connecting…</div></header>

<section id="pair" hidden>
  <h2>Pair this device</h2>
  <p>In FaderDeck on your PC, open Settings, Remote control, and press PAIR A DEVICE. Type the code it shows.</p>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
  <div class="row"><button id="pairButton">PAIR</button></div>
  <p id="error"></p>
</section>

<main id="mixer" hidden></main>

<script>
const COLORS = {Mic: "#35c8ff", Game: "#ff626b", Chat: "#a68aff", Media: "#24d6a0"};
let token = localStorage.getItem("faderdeckToken") || "";
let dragging = null;
let built = false;
const $ = (id) => document.getElementById(id);

async function call(method, path) {
  const response = await fetch("/remote/api/" + path, {
    method, headers: {"X-FaderDeck-Token": token}, cache: "no-store"});
  if (response.status === 401) { forget(); throw new Error("not paired"); }
  return response.json();
}

function forget() {
  token = ""; localStorage.removeItem("faderdeckToken");
  $("mixer").hidden = true; $("pair").hidden = false; $("status").textContent = "Not paired";
}

async function pair() {
  $("error").textContent = "";
  const response = await fetch("/remote/pair", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({code: $("code").value.trim()})});
  const answer = await response.json();
  if (!response.ok) { $("error").textContent = answer.error || "That did not work."; return; }
  token = answer.token; localStorage.setItem("faderdeckToken", token);
  $("pair").hidden = true; refresh();
}
$("pairButton").onclick = pair;
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") pair(); });

function card(name, label) {
  const color = COLORS[name] || "#58a6ff";
  const box = document.createElement("section");
  box.className = "card"; box.style.setProperty("--accent", color);
  box.innerHTML = `<h2><span style="color:${color}"></span><small></small></h2>
    <input type="range" min="-60" max="12" step="0.5">
    <div class="row"><button class="mute">MUTE</button></div>`;
  box.querySelector("h2 span").textContent = label;
  const slider = box.querySelector("input");
  let timer = null;
  slider.addEventListener("pointerdown", () => dragging = name);
  slider.addEventListener("pointerup", () => dragging = null);
  slider.addEventListener("input", () => {
    box.querySelector("small").textContent = format(slider.value);
    clearTimeout(timer);
    timer = setTimeout(() => call("POST", `gain/${name.toLowerCase()}?db=${slider.value}`), 80);
  });
  box.querySelector(".mute").onclick = () =>
    call("POST", `mute/${name.toLowerCase()}?state=toggle`).then(refresh);
  if (name === "Mic") {
    const extra = document.createElement("div");
    extra.className = "row";
    extra.innerHTML = `<button id="listen">LISTEN</button><button id="stream">OFF STREAM</button>`;
    box.appendChild(extra);
    extra.querySelector("#listen").onclick = () => call("POST", "listen?state=toggle").then(refresh);
    extra.querySelector("#stream").onclick = () => call("POST", "stream-mute?state=toggle").then(refresh);
  }
  return box;
}

function format(db) { db = Number(db); return (db > 0 ? "+" : "") + db.toFixed(1) + " dB"; }

function build(state) {
  const main = $("mixer"); main.innerHTML = "";
  for (const name of Object.keys(state.channels)) {
    const box = card(name, (state.names || {})[name] || name);
    box.dataset.channel = name; main.appendChild(box);
  }
  const profiles = document.createElement("section");
  profiles.className = "card";
  profiles.innerHTML = `<h2>Setup profile<small id="profileState"></small></h2>
    <div class="row"><select id="profiles"></select><button id="load">LOAD</button></div>`;
  main.appendChild(profiles);
  profiles.querySelector("#load").onclick = () => {
    const name = $("profiles").value;
    if (name) call("POST", "profile/" + encodeURIComponent(name)).then(refresh);
  };
  built = true;
}

async function refresh() {
  if (!token) { forget(); return; }
  try {
    const state = await call("GET", "state");
    if (!built) build(state);
    $("mixer").hidden = false;
    $("status").textContent = state.connected ? "Connected" : "VoiceMeeter is not running";
    $("status").className = state.connected ? "ok" : "";
    for (const box of document.querySelectorAll(".card[data-channel]")) {
      const name = box.dataset.channel, channel = state.channels[name];
      if (!channel) continue;
      box.querySelector(".mute").classList.toggle("on", channel.mute);
      if (dragging !== name) {
        box.querySelector("input").value = channel.gain;
        box.querySelector("small").textContent = format(channel.gain);
      }
    }
    if ($("listen")) {
      $("listen").classList.toggle("on", !!state.listen);
      $("stream").classList.toggle("on", !!state.stream_mute);
      $("stream").disabled = state.stream_mute === null;
    }
    const list = await call("GET", "profiles");
    const select = $("profiles");
    const names = list.profiles.join("\n");
    if (select.dataset.names !== names) {
      select.dataset.names = names; select.innerHTML = "";
      for (const name of list.profiles) select.add(new Option(name, name));
    }
    if (list.active && document.activeElement !== select) select.value = list.active;
    $("profileState").textContent = list.active ? (state.profile_changed ? "changed" : "loaded") : "";
  } catch (error) {
    if (token) { $("status").textContent = "FaderDeck is not reachable"; $("status").className = ""; }
  }
}

refresh();
setInterval(() => { if (token && !document.hidden) refresh(); }, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0d1117">
<link rel="manifest" href="/remote/manifest.webmanifest">
<link rel="icon" href="/remote/icon-192.png">
<link rel="apple-touch-icon" href="/remote/icon-192.png">
<title>FaderDeck</title>
<style>
:root { --bg: #0d1117; --card: #111923; --line: #30363d; --text: #e6edf3; --muted: #8ba0b5;
        --blue: #58a6ff; --red: #f85149; }
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); overflow: hidden;
       font: 15px/1.3 "Segoe UI", system-ui, sans-serif; user-select: none; -webkit-user-select: none;
       display: flex; flex-direction: column; height: 100dvh;
       padding: env(safe-area-inset-top) env(safe-area-inset-right)
                env(safe-area-inset-bottom) env(safe-area-inset-left); }
header { display: flex; align-items: center; gap: 10px; padding: 10px 14px; flex: none; }
header img { width: 28px; height: 28px; border-radius: 7px; }
header b { font-size: 18px; } header b span { color: #8a5cff; font-weight: 400; }
#mixes { display: flex; margin-left: 12px; }
#mixes button { min-height: 32px; padding: 0 12px; border-radius: 0; }
#mixes button:first-child { border-radius: 8px 0 0 8px; }
#mixes button:last-child { border-radius: 0 8px 8px 0; }
#mixes button.on { color: #fff; }
#mixYou.on { background: #1f6feb; border-color: #58a6ff; }
#mixStream.on { background: #b35c12; border-color: #f0883e; }
#status { margin-left: auto; font-size: 13px; color: var(--muted); }
#status.ok { color: #3fb950; }

#mixer { flex: 1; min-height: 0; display: flex; gap: 8px; padding: 0 10px; }
.strip { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 8px;
         background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 10px; }
.strip h2 { margin: 0; font-size: 16px; text-align: center; color: var(--accent);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.strip .db { text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.fader { flex: 1; min-height: 120px; position: relative; touch-action: none; cursor: pointer; }
.fader .track { position: absolute; left: 50%; top: 14px; bottom: 14px; width: 8px;
                transform: translateX(-50%); border-radius: 4px; background: #30363d; }
.fader .fill { position: absolute; left: 0; right: 0; bottom: 0; border-radius: 4px; background: var(--accent); }
.fader .thumb { position: absolute; left: 50%; width: min(70%, 64px); height: 28px;
                transform: translate(-50%, 50%); border-radius: 8px; background: var(--accent);
                box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
.fader .thumb::after { content: ""; position: absolute; left: 18%; right: 18%; top: 50%;
                       height: 2px; margin-top: -1px; background: rgba(0,0,0,.45); }
.fader .tick { position: absolute; left: 0; width: 22%; border-top: 1px solid #3b4652;
               font-size: 10px; color: var(--muted); padding-left: 2px; line-height: 0; }
.fader .tick span { position: relative; top: -7px; }
.buttons { display: grid; gap: 6px; }
button { min-height: 44px; border-radius: 9px; border: 1px solid var(--line); background: #18232e;
         color: var(--text); font: 600 13px "Segoe UI", system-ui, sans-serif; padding: 0 4px; }
button.on { border-color: var(--accent); color: var(--accent); background: #16202b; }
button.mute.on, button.streammute.on { border-color: var(--red); color: #fff; background: #54262c; }
button:disabled { opacity: .35; }

footer { flex: none; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px; }
footer .group { display: flex; gap: 8px; align-items: center; flex: 1 1 300px; min-width: 0; }
footer .mic { flex: 0 1 auto; --accent: #35c8ff; }
footer label { color: var(--muted); font-size: 13px; white-space: nowrap; }
footer select { flex: 1; min-width: 0; min-height: 44px; border-radius: 9px; border: 1px solid var(--line);
                background: #18232e; color: var(--text); font-size: 15px; padding: 0 8px; }
footer button { flex: none; padding: 0 18px; }
#profileState { color: var(--muted); font-size: 12px; min-width: 52px; }

#pair { max-width: 360px; margin: 40px auto; text-align: center; padding: 0 16px; overflow: auto; }
#pair input { width: 100%; font-size: 30px; letter-spacing: 8px; text-align: center; padding: 10px;
              border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--text); }
#pair p { color: var(--muted); }
#pair button { width: 100%; margin-top: 10px; }
#error { color: var(--red); min-height: 20px; }
[hidden] { display: none !important; }
/* A phone held sideways: every pixel of height goes to the faders. */
@media (max-height: 500px) {
  header { padding: 4px 10px; } header img { width: 22px; height: 22px; } header b { font-size: 15px; }
  #mixer { gap: 6px; padding: 0 6px; }
  .strip { padding: 6px; gap: 4px; }
  .strip h2 { font-size: 14px; } .strip .db { font-size: 13px; }
  .fader { min-height: 80px; } .fader .track { top: 10px; bottom: 10px; }
  .fader .thumb { height: 22px; }
  button { min-height: 36px; } footer select { min-height: 36px; }
  footer { padding: 6px; gap: 6px; }
}
</style>
</head>
<body>
<header><img src="/remote/icon-192.png" alt=""><b>Fader<span>Deck</span></b>
  <div id="mixes" hidden><button id="mixYou" class="on" title="The faders set what you hear">You</button><button id="mixStream" title="The faders set what your stream hears">Stream</button></div>
  <div id="status">Connecting…</div></header>

<section id="pair" hidden>
  <h2>Pair this device</h2>
  <p>In FaderDeck on your PC, open Settings, Remote control, and press "Pair a device". Type the code it shows.</p>
  <input id="code" inputmode="numeric" maxlength="6" autocomplete="one-time-code" placeholder="000000">
  <button id="pairButton">Pair</button>
  <p id="error"></p>
</section>

<main id="mixer" hidden></main>
<footer id="footer" hidden>
  <div class="group mic">
    <label>Mic</label>
    <button id="listen" title="Hear your own microphone">Monitor</button>
    <button id="stream" class="streammute" title="Mute your microphone for the stream only; voice chat still hears you"><svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true" style="vertical-align:-2px;margin-right:4px"><rect x="8.2" y="3.2" width="7.6" height="11.6" rx="3.8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M5.5 11.5v1.1a6.5 6.5 0 0 0 13 0v-1.1M12 19.1v2.1M8.5 21.2h7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>Mute stream</button>
  </div>
  <div class="group">
    <label for="profiles">Profile</label>
    <select id="profiles"></select>
    <button id="load">Load</button>
    <span id="profileState"></span>
  </div>
</footer>

<script>
const COLORS = {Mic: "#35c8ff", Game: "#ff626b", Chat: "#a68aff", Media: "#24d6a0"};
const MIN_DB = -60, MAX_DB = 12;
const PAGE_VERSION = "{{PAGE_VERSION}}";
let token = localStorage.getItem("faderdeckToken") || "";
let dragging = null;
let mix = "you";  // which mix this device's faders set
let built = false;
const $ = (id) => document.getElementById(id);

async function call(method, path) {
  const response = await fetch("/remote/api/" + path, {
    method, headers: {"X-FaderDeck-Token": token}, cache: "no-store"});
  if (response.status === 401) { forget(); throw new Error("not paired"); }
  return response.json();
}

function forget() {
  token = ""; localStorage.removeItem("faderdeckToken");
  $("mixer").hidden = $("footer").hidden = true; $("pair").hidden = false;
  $("status").textContent = "Not paired"; $("status").className = "";
}

async function pair() {
  $("error").textContent = "";
  const response = await fetch("/remote/pair", {method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({code: $("code").value.trim()})});
  const answer = await response.json();
  if (!response.ok) { $("error").textContent = answer.error || "That did not work."; return; }
  token = answer.token; localStorage.setItem("faderdeckToken", token);
  $("pair").hidden = true; refresh();
}
$("pairButton").onclick = pair;
$("code").addEventListener("keydown", (e) => { if (e.key === "Enter") pair(); });

function format(db) { db = Number(db); return (db > 0 ? "+" : "") + db.toFixed(1) + " dB"; }
const share = (db) => (db - MIN_DB) / (MAX_DB - MIN_DB);  // 0 at the bottom, 1 at the top

// A vertical fader: drag anywhere on it, double-tap for 0 dB.
function fader(strip, name) {
  const box = strip.querySelector(".fader");
  const track = box.querySelector(".track"), fill = box.querySelector(".fill"), thumb = box.querySelector(".thumb");
  for (const db of [12, 0, -12, -24, -36, -48, -60]) {
    const tick = document.createElement("div");
    tick.className = "tick"; tick.innerHTML = `<span>${db > 0 ? "+" + db : db}</span>`;
    box.appendChild(tick);
  }
  const ticks = [...box.querySelectorAll(".tick")];
  let value = 0, sendTimer = null, lastTap = 0;

  function place(db) {
    value = Math.max(MIN_DB, Math.min(MAX_DB, db));
    const top = track.offsetTop, height = track.offsetHeight;
    fill.style.height = share(value) * 100 + "%";
    thumb.style.top = (top + height * (1 - share(value))) + "px";
    [12, 0, -12, -24, -36, -48, -60].forEach((mark, i) =>
      ticks[i].style.top = (top + height * (1 - share(mark))) + "px");
    strip.querySelector(".db").textContent = format(value);
  }
  function send() {
    clearTimeout(sendTimer);
    sendTimer = setTimeout(() => call("POST", `gain/${name.toLowerCase()}?db=${value.toFixed(1)}&mix=${mix}`), 60);
  }
  function fromPointer(event) {
    const rect = track.getBoundingClientRect();
    const ratio = 1 - (event.clientY - rect.top) / rect.height;
    place(Math.round((MIN_DB + ratio * (MAX_DB - MIN_DB)) * 2) / 2);  // 0.5 dB steps
    send();
  }
  box.addEventListener("pointerdown", (event) => {
    const now = Date.now();
    if (now - lastTap < 300) { place(0); send(); lastTap = 0; return; }
    lastTap = now;
    dragging = name; box.setPointerCapture(event.pointerId); fromPointer(event);
  });
  box.addEventListener("pointermove", (event) => { if (dragging === name) fromPointer(event); });
  const release = () => { if (dragging === name) { dragging = null; send(); } };
  box.addEventListener("pointerup", release);
  box.addEventListener("pointercancel", release);
  new ResizeObserver(() => place(value)).observe(box);
  return place;
}

function strip(name, label) {
  const element = document.createElement("section");
  element.className = "strip"; element.dataset.channel = name;
  element.style.setProperty("--accent", COLORS[name] || "#58a6ff");
  element.innerHTML = `<h2></h2><div class="db"></div>
    <div class="fader"><div class="track"><div class="fill"></div></div><div class="thumb"></div></div>
    <div class="buttons"><button class="mute">Mute</button></div>`;
  element.querySelector("h2").textContent = label;
  element.place = fader(element, name);
  element.querySelector(".mute").onclick = () =>
    call("POST", `mute/${name.toLowerCase()}?state=toggle`).then(refresh);
  return element;
}

function build(state) {
  const main = $("mixer"); main.innerHTML = "";
  for (const name of Object.keys(state.channels)) {
    main.appendChild(strip(name, (state.names || {})[name] || name));
  }
  $("mixYou").onclick = () => { mix = "you"; refresh(); };
  $("mixStream").onclick = () => { mix = "stream"; refresh(); };
  $("listen").onclick = () => call("POST", "monitor?state=toggle").then(refresh);
  $("stream").onclick = () => call("POST", "stream-mute?state=toggle").then(refresh);
  $("load").onclick = () => {
    const name = $("profiles").value;
    if (name) call("POST", "profile/" + encodeURIComponent(name)).then(refresh);
  };
  built = true;
}

async function refresh() {
  if (!token) { forget(); return; }
  try {
    const state = await call("GET", "state");
    if (state.page && state.page !== PAGE_VERSION) { location.reload(); return; }
    if (!built) build(state);
    $("mixer").hidden = $("footer").hidden = false;
    $("status").textContent = state.connected ? "Connected" : "VoiceMeeter is not running";
    $("status").className = state.connected ? "ok" : "";
    for (const element of document.querySelectorAll(".strip")) {
      const name = element.dataset.channel, channel = state.channels[name];
      if (!channel) continue;
      element.querySelector(".mute").classList.toggle("on", channel.mute);
      const gain = mix === "stream" && channel.stream_gain !== undefined ? channel.stream_gain : channel.gain;
      if (dragging !== name) element.place(gain);
    }
    $("mixes").hidden = !state.stream_mix;
    if (!state.stream_mix) mix = "you";
    $("mixYou").classList.toggle("on", mix === "you");
    $("mixStream").classList.toggle("on", mix === "stream");
    $("listen").classList.toggle("on", !!state.monitor);
    $("stream").classList.toggle("on", !!state.stream_mute);
    $("stream").disabled = state.stream_mute === null;
    const list = await call("GET", "profiles");
    const select = $("profiles"), names = list.profiles.join("\n");
    if (select.dataset.names !== names) {
      select.dataset.names = names; select.innerHTML = "";
      for (const name of list.profiles) select.add(new Option(name, name));
    }
    if (list.active && document.activeElement !== select) select.value = list.active;
    $("profileState").textContent = list.active ? (state.profile_changed ? "changed" : "loaded") : "";
  } catch (error) {
    if (token) { $("status").textContent = "FaderDeck is not reachable"; $("status").className = ""; }
  }
}

refresh();
setInterval(() => { if (token && !document.hidden && !dragging) refresh(); }, 1500);
document.addEventListener("visibilitychange", () => { if (!document.hidden) refresh(); });
</script>
</body>
</html>
